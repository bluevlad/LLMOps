# DocPipeline 파싱 정제(refine) 슬롯 후보 비교 — gemma4:12b-mlx vs exaone3.5:7.8b (LLM-as-judge).
#
# 목적: DocumetsToAiPipeLine REFINE_LLM_MODEL 기본값 결정 근거. 후보 2종이 파싱 결과에서
#   머리말/꼬리말·페이지 번호·깨짐 문자·중복 문단을 얼마나 정확히 제거하고, 본문을 한 글자도 바꾸지 않는지 채점.
# 프롬프트는 DocPipeline app/shared/prompts.py REFINE_SYSTEM_PROMPT + build_refine_prompt 와 동일 —
#   운영 프롬프트 그대로 평가해야 전환 판단이 유효함. DocPipeline 쪽 변경(REFINE_VERSION) 시 함께 갱신.
# 운영 호출 옵션과 맞춤: gemma4 think:false. (temperature 0 은 러너 미지원 — 실행 간 편차는 run 을 2회 돌려 확인)
#
# 실행 (호스트):
#   DATABASE_URL=postgresql+asyncpg://llmops_svc:<pw>@localhost:5432/llmops_dev \
#   OLLAMA_BASE_URL=http://localhost:11434 ANTHROPIC_API_KEY=... \
#   .venv/bin/python -m scripts.run_comparison --prompt-set scripts/prompts/docpipeline-refine-2026q3.yaml

case_name: docpipeline-refine-slot-2026q3
prompt_set_id: docpipeline-refine-2026q3
description: >
  DocPipeline 파싱 정제 슬롯 — gemma4:12b-mlx vs exaone3.5:7.8b. HWP/PDF/OCR 파싱 결과 6건
  (머리말·꼬리말·페이지 번호·깨짐 문자·중복 문단·OCR 줄바꿈) 정제 품질을 fidelity/noise_removal/structure 로 채점.

judge:
  model: claude-opus-5
  dimensions: [fidelity, noise_removal, structure]
  rubric: |
    [Input prompt] 의 <원문> 과 [Model output] 을 비교해 0.0~1.0 으로 채점:
    - fidelity: 본문 문장·수치·고유명사·장절 번호가 원문 그대로인가. 문장을 바꿔 쓰거나 합치거나 요약·추가한 흔적이 있으면 크게 감점(0.3 이하), 원문에 없는 문장이 생겼으면 0.
    - noise_removal: 반복 머리말/꼬리말·페이지 번호·깨짐 문자(�, ■■ 등)·페이지 경계 중복 문단·OCR 단어 중간 줄바꿈이 모두 제거됐는가. 남은 노이즈 항목 수에 비례해 감점.
    - structure: 장·절 제목과 번호, 목록 기호, 표의 행 구분(| 셀 | 셀 |)이 읽을 수 있게 유지됐는가. 마크다운 제목 기호(#)·강조(**)·프롬프트 머리말·<원문> 태그를 새로 붙였으면 감점.
    score 는 fidelity 에 0.5, noise_removal 0.3, structure 0.2 가중 평균. JSON 만 반환.

models:
  - id: gemma4:12b-mlx
    provider: ollama
    think: false        # thinking 모델 — reasoning 이 출력 토큰 소진 방지 (DocPipeline refine.model_options 와 동일)
  - id: exaone3.5:7.8b
    provider: ollama

# DocPipeline REFINE_SYSTEM_PROMPT (REFINE_VERSION 2026-09-10.1) + build_refine_prompt 머리 지시문 — 모든 항목 앞에 공통 삽입
input_prefix: |
  너는 문서 파싱(HWP/Office/PDF/OCR) 결과 텍스트를 정제하는 편집자다. 편집 범위는 '제거' 뿐이다. 제거 대상: 페이지마다 반복되는 머리말·꼬리말·페이지 번호, 인코딩 깨짐 문자(�, ▒, ■■ 같은 의미 없는 기호 나열), 페이지 경계에서 그대로 반복된 중복 문단, OCR 로 생긴 단어 중간의 불필요한 줄바꿈. 그 외에는 원문을 한 글자도 바꾸지 않는다 — 문장을 합치거나 바꿔 쓰지 않고, 어미·조사·표현도 그대로 두며, 요약·추가·해석을 하지 않는다. 장·절 제목과 번호(1., 1.1, 가. 등)·목록 기호·수치·고유명사·날짜는 반드시 그대로 유지한다. 표는 원래의 행 구분(| 셀 | 셀 | 형식 등)을 유지한다. 원문에 없는 문장을 절대 만들지 않는다. 마크다운 제목 기호(#)·강조(**)·새 제목 줄을 붙이지 않는다 — 원문의 평문 형식 그대로 둔다. 정제된 본문 텍스트만 출력한다 — 설명·코드 펜스를 붙이지 않는다.

  아래 <원문> 과 </원문> 사이의 파싱 결과를 정제하라. 태그·파일명·이 지시문은 출력하지 말고 정제된 본문만 출력한다.

